name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: listen socket
        run: python3 scripts/test_listen.py
      - name: copilot classify
        run: python3 scripts/test_copilot_classify.py
      - name: quota replay
        run: python3 scripts/test_quota_replay.py
      - name: socket snapshot
        run: python3 scripts/test_socket_snapshot.py
